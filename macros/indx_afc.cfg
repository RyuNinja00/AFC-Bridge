#####################################################################
#  INDX-AFC bridge: registration with INDX and its settings
#  (klipper_extras/indx_afc.py). For INDX v1.0-beta.11 (beta.7, beta.6 and beta.5 work too).
#
#  Linked into ~/printer_data/config/indx/ext/ by install.sh, so INDX's
#  indx_includes.cfg loads it ([include ext/*.cfg]). Do not edit this file;
#  your lanes go into printer.cfg:
#
#    [indx_afc]
#    lanes: lane1, lane2, lane3, lane4
#
#  role: tool_manager is what makes INDX unsync the synced lane around
#  every latch move (the INDX extruder motor also drives the latch). The
#  bridge does not own T<n>: INDX keeps its tool changes, and AFC's T<n> end
#  in INDX's tool change. It owns M104/M109 only to put INDX's heat rules
#  back over AFC's (AFC replaces them at its start). Spoolman's active spool
#  follows the lane on the head through AFC.
#
#  The settings show on the INDX page under More, Settings, Extensions
#  (beta.6 and later; Settings, Extensions on beta.5), and are
#  kept across restarts by INDX (indx_settings). From the console:
#    INDX_SETTING MACRO=_INDX_AFC VAR=<name> VALUE=<value>
#####################################################################

[gcode_macro _INDX_AFC]
description: Inner - the INDX-AFC bridge's settings (change them on the INDX page, or with INDX_SETTING)
variable_spool_join: True
variable_print_check: "warn"
variable_load_type: "none"
variable_prime_test: False
variable_ram_relief: 0.0
variable_unload_chunk: 8.0
gcode:
    INDX_AFC_STATUS

[indx_extension indx_afc]
version: 0.2.11
api: 1
role: tool_manager
description: AFC lanes feeding INDX tools one to one: lane sync, assisted load and unload, runouts to INDX's spool join
owns_tool_commands: False
owns_temp_commands: True
spoolman_link: off
settings_macro: _INDX_AFC
settings_tab: Box Turtle (AFC)
settings_note: One AFC lane per INDX tool. INDX_AFC_STATUS shows the lanes.
setting_spool_join: Spool join | bool | | | A lane that runs out hands its print to another tool with the same filament (INDX's spool join). Off: the print pauses.
setting_print_check: Print start check | choice:off,warn,stop | | | At INDX_PRINT_START: a spool that is out, or an empty tool whose lane has filament.
setting_load_type: Load material | choice:none,PLA,PETG,ABS,ASA,PA,PC,TPU | | | The material for a load when the spool has none in AFC.
setting_prime_test: Prime test after a load | bool | | | Runs INDX_PRIME_TEST after INDX_AFC_LOAD.
setting_ram_relief: Ram relief (mm) | number | 0 | 10 | The lane backs off this far after ramming to the gears. Raise it if INDX reports a misload at the next pickup.
setting_unload_chunk: Unload step (mm) | number | 3 | 20 | The unload pull runs in parts this long, the lane taking each back. Keep it under the buffer's travel.
